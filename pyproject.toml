[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "candyshopdata"
version = "0.1.0"
description = "Synthetic multi-source data for SweetReach, a SaaS that helps candy shops find customers and sell more candy"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "faker>=30",
    "pyarrow>=16",
    "psycopg[binary]>=3.1",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
candy = "candyshop.cli:main"

[tool.setuptools.packages.find]
include = ["candyshop*"]

[tool.setuptools.package-data]
candyshop = ["emit/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
